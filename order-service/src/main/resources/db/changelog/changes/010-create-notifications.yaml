databaseChangeLog:
  # Bildirimler Kafka tüketicisi tarafından yazılır: sipariş oluşunca veya
  # durumu değişince olay yayınlanır, tüketici bu tabloya kayıt düşer.
  # Sipariş akışı bildirime bağımlı DEĞİLDİR — Kafka kapalıysa sipariş yine
  # tamamlanır, yalnızca bildirim oluşmaz (gevşek bağlılık).
  - changeSet:
      id: 010-create-notifications
      author: aurora
      changes:
        - createTable:
            tableName: notifications
            schemaName: orders
            columns:
              - column:
                  name: id
                  type: BIGSERIAL
                  autoIncrement: true
                  constraints: { primaryKey: true, nullable: false }
              - column:
                  name: customer_id
                  type: BIGINT
                  constraints: { nullable: false }
              - column:
                  name: order_id
                  type: BIGINT
              - column:
                  name: type
                  type: VARCHAR(40)
                  constraints: { nullable: false }
              - column:
                  name: title
                  type: VARCHAR(120)
                  constraints: { nullable: false }
              - column:
                  name: body
                  type: TEXT
              - column:
                  name: read_at
                  type: TIMESTAMP WITHOUT TIME ZONE
              - column:
                  name: created_at
                  type: TIMESTAMP WITHOUT TIME ZONE
                  defaultValueComputed: CURRENT_TIMESTAMP
                  constraints: { nullable: false }
        # Aynı olayın iki kez işlenmesi durumunda mükerrer bildirim oluşmasın:
        # Kafka "en az bir kez" teslim garantisi verir, tüketici tekrar
        # çağrılabilir. (order_id, type) benzersizliği bunu engeller.
        - addUniqueConstraint:
            tableName: notifications
            schemaName: orders
            columnNames: order_id, type
            constraintName: uk_notifications_order_type
        - createIndex:
            tableName: notifications
            schemaName: orders
            indexName: idx_notifications_customer
            columns:
              - column: { name: customer_id }
      rollback:
        - dropTable: { tableName: notifications, schemaName: orders }
