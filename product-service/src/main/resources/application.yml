server:
  port: ${PORT:8080}

spring:
  datasource:
    # Ortam değişkeni gelirse (Docker) onu kullan, gelmezse (IDE) localhost:5455 kullan
    url: ${JDBC_DATABASE_URL:jdbc:postgresql://localhost:5455/aurora}
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD:dev}
  data:
    redis:
      url: ${REDIS_URL:redis://localhost:6379}
      # Redis'e ulaşılamazsa (ör. farklı bölgedeki servis) hızlı vazgeç — cache
      # isteği hiçbir zaman uzun süre askıda bırakmasın, CacheErrorHandler devreye girsin.
      connect-timeout: 2000
      timeout: 2000
      lettuce:
        shutdown-timeout: 100
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        default_schema: product
  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.yaml
    default-schema: product
    liquibase-schema: public
  cloud:
    openfeign:
      client:
        config:
          default:
            # Sipariş servisi cevap vermiyorsa hızlı pes et: yorum yazma
            # doğrulaması yüzünden istek dakikalarca askıda kalmasın.
            connectTimeout: 3000
            readTimeout: 5000

# Yorum yazma hakkı için sipariş servisine soruyoruz (servisler arası kapı).
# INTERNAL_TOKEN order-service ile AYNI değer olmalı.
order-service:
  url: ${ORDER_SERVICE_URL:http://localhost:8085}
  internal-token: ${INTERNAL_TOKEN:local-internal-token}

# Üretimde JWT_SECRET ortam değişkeni MUTLAKA set edilmeli (Render → Environment).
# Buradaki değer yalnızca yerel geliştirme içindir ve repo'da herkese açıktır.
jwt:
  secret: ${JWT_SECRET:aurora-super-secret-key-must-be-32-bytes-long!}

# §10.5: yapılandırılmış (ECS) console log çıktısı — MDC'deki traceId otomatik dahil olur
logging:
  structured:
    format:
      console: ecs
# Swagger/OpenAPI — /swagger-ui.html
# Üretimde kapatmak istersen SWAGGER_ENABLED=false yeterli; uygulama normal çalışır.
springdoc:
  api-docs:
    enabled: ${SWAGGER_ENABLED:true}
  swagger-ui:
    enabled: ${SWAGGER_ENABLED:true}
    # Uçlar HTTP metoduna göre değil, ait oldukları gruba göre sıralansın
    operations-sorter: alpha
    tags-sorter: alpha
