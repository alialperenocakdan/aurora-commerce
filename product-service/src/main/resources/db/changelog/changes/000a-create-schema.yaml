databaseChangeLog:
  - changeSet:
      id: 000a-create-schema
      author: aurora
      changes:
        # Liquibase'in kendi izleme tablosu 'public' şemasında tutulur (application.yml'de
        # liquibase-schema: public), bu yüzden bu adım her zaman çalışabilir — 'product' şeması
        # henüz yokken bile. Sonraki tüm changeset'ler bu şemanın var olduğunu varsayabilir.
        - sql:
            sql: "CREATE SCHEMA IF NOT EXISTS product;"
      rollback:
        - sql:
            sql: "DROP SCHEMA IF EXISTS product CASCADE;"
